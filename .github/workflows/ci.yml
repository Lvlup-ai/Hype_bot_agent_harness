name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: The example runs end to end
        run: python -m examples.dataset_audit.run --runs-root /tmp/example-runs --run-id ci
      - name: The example's briefs tell the truth about the code
        run: python -m agent_harness.prompt_tests examples/dataset_audit/prompt_checks.yaml --base .
